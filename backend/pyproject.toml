[project]
name = "airport-agent-backend"
version = "0.1.0"
description = "Airport Investment Intelligence Agent: FastAPI + Pydantic AI backend, deterministic analytics over the Snapshot"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic-ai-slim[anthropic,ui]==2.58.0",
    # anthropic 2.0.0 (2026-10-21) breaks pydantic-ai 2.58 (BetaMessageParam became a Union)
    "anthropic>=1.12.1,<2",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "duckdb>=1.1",
    "pyarrow>=17",
    "pandas>=2.2",
    "openpyxl>=3.1",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "asyncpg>=0.30",
]

[dependency-groups]
dev = [
    "playwright>=1.64.0",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff==0.16.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["live: calls the real Anthropic API (spends money); run with -m live"]
addopts = "-m 'not live'"
asyncio_mode = "auto"

# One lint config for every Python tree: backend/app, backend/tests, ../ingest and ../tests/e2e (the root
# ruff.toml extends this file so those trees find it too). `make lint` runs it, and `make test` runs lint first.
# Ruff's own default rule set applies, plus the rules below.
[tool.ruff]
src = [".", "..", "../ingest"]
line-length = 120  # the house width; ruff only uses it to wrap sorted imports (E501 is not enabled)

[tool.ruff.lint]
# The code marks its deliberate exceptions to these rules with noqa (path setup before imports,
# re-exports, broad catches turned into ToolError, the shared live client); enabling them keeps
# those markers checked instead of dead.
extend-select = ["E402", "F401", "BLE001", "SLF001"]
# UP046: ToolResult stays a typing.Generic pydantic model (the tool contract), PEP 695 syntax is style only.
ignore = ["UP046"]
