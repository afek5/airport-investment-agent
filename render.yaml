# Render Blueprint: one free Docker web service plus one free Render Postgres (SPEC §2).
# Deploy notes: the "Deploy (Render)" section of README.md. One Render account is all it takes.
#
# You type in only two values when the Blueprint is created: ANTHROPIC_API_KEY and ACCESS_CODE
# (`sync: false`, so they never enter git). OPENAI_API_KEY is optional (also `sync: false`): leave it blank
# and the voice call stays off. Render generates SESSION_SECRET and wires DATABASE_URL to
# the database below.
databases:
  - name: airport-db
    plan: free # Render's free Postgres expires after 30 days, which is enough for a reviewed demo
    region: ohio
    databaseName: airport
    user: airport

services:
  - type: web
    name: airport-investment-agent
    runtime: docker
    plan: free
    region: ohio # same region as airport-db, so the internal connection string works
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # The Dockerfile CMD runs uvicorn with --proxy-headers --forwarded-allow-ips '*', so the client IP
    # comes from X-Forwarded-For behind Render's proxy. Render injects PORT and the CMD binds to it.
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      # Anthropic (server-side only)
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: MODEL_ID
        value: anthropic:claude-sonnet-5-5
      # OpenAI (optional, server-side only): turns on the voice call (gpt-live-1). Blank = no Call button.
      - key: OPENAI_API_KEY
        sync: false
      - key: VOICE_CALLS_PER_DAY
        value: "10"
      # Access gate: the password reviewers type. Session cookies are signed with a generated secret.
      - key: ACCESS_CODE
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      # Spend and abuse guards (SPEC §9). The hosted demo stops for the day at $1, and for good at $2 in total.
      - key: DAILY_BUDGET_USD
        value: "1"
      - key: TOTAL_BUDGET_USD
        value: "2"
      - key: RATE_LIMIT_PER_HOUR
        value: "30"
      # Postgres: Render's internal connection string for airport-db
      - key: DATABASE_URL
        fromDatabase:
          name: airport-db
          property: connectionString
