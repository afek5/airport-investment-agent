# P2 integration + verification suite (HANDOFF P2). Run from the repo root with the backend env:
#   uv run --project backend pytest -q tests/e2e              (golden tool tests, offline)
#   make test-live                                            (live e2e G1–G6, real Claude)
#   make e2e                                                  (Playwright smoke against docker compose)
[pytest]
pythonpath = ../../backend
markers =
    live: calls the real Anthropic API (spends money); run with -m live
    e2e: browser smoke test against a running app (make e2e)
addopts = -m "not live and not e2e"
asyncio_mode = auto
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
